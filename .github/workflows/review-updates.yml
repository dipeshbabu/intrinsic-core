name: Validate updated math PRs
'on':
  push:
    branches:
    - ci/review-updates-20261001
permissions:
  contents: read
jobs:
  math:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - pr: 2
          commit: 63879198786bd7ac55d07a38fdd60e8a0026ff4f
        - pr: 7
          commit: 434ef2a05fbe5448c05812d2b21008718ace570f
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.commit }}
        persist-credentials: false
    - uses: bazel-contrib/setup-bazel@0.14.0
      with:
        bazelisk-cache: true
    - run: bazel test //intrinsic_sdk/intrinsic/math/python:all --spawn_strategy=processwrapper-sandbox --test_output=errors
