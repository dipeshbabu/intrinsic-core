name: Validate functional fixes before opening PRs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Complete build and tests for each independent fix
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out validation tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Save validation script outside source checkout
        run: cp .github/scripts/validate-functional-regression.sh "$RUNNER_TEMP/validate-functional-regression.sh"
      - name: Check out pose serialization fix
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1d3f960ae1845fdd02e15364144b7e5094b5ddaf
          fetch-depth: 0
          lfs: true
      - name: Reclaim space on disposable hosted runner
        # A prior checkout without LFS can leave unchanged files as pointers.
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
      - name: Materialize and verify pose-fix LFS assets
        run: |
          git lfs pull
          if git lfs ls-files --long | grep -E '^[0-9a-f]{64} - '; then
            echo 'LFS pointer files remain in the checkout.'
            exit 1
          fi
          test "$(head -c 4 intrinsic_control/intrinsic/models/assets/standard_tooling/robotiq_hande/io_coupler_visual.glb)" = glTF
      - name: Enable isolated test networking
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel_install_base=$(bazel --batch info install_base)
          sudo tee /etc/apparmor.d/intrinsic-bazel-linux-sandbox > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile intrinsic-bazel-linux-sandbox "$bazel_install_base/linux-sandbox" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/intrinsic-bazel-linux-sandbox
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Verify pose fix and reproduce original failure
        run: |
          bash "$RUNNER_TEMP/validate-functional-regression.sh" \
            1d3f960ae1845fdd02e15364144b7e5094b5ddaf proto_conversion.py \
            'ERROR: test_pose_to_proto_normalizes_near_unit_quaternion' \
            //intrinsic_sdk/intrinsic/math/python:proto_conversion_test
      - name: Build all targets for pose fix
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel build //... --spawn_strategy=processwrapper-sandbox
      - name: Build published CI artifacts for pose fix
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel build //intrinsic_runtime:intrinsic_base //intrinsic/tools/inctl:inctl_external \
            --spawn_strategy=processwrapper-sandbox
      - name: Test all targets for pose fix
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel test //... --spawn_strategy=processwrapper-sandbox \
            --strategy=TestRunner=linux-sandbox --test_output=errors
      - name: Check out reflection validation fix
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9171c96a89b4ee3db41fc6fd339cc085c7e1d761
          fetch-depth: 0
          lfs: true
      - name: Verify reflection fix and reproduce original failure
        # Materialize unchanged assets after switching source commits too.
        run: |
          bash "$RUNNER_TEMP/validate-functional-regression.sh" \
            9171c96a89b4ee3db41fc6fd339cc085c7e1d761 rotation3.py \
            'FAIL: test_from_matrix.*rejects_reflection' \
            //intrinsic_sdk/intrinsic/math/python:rotation3_test \
            //intrinsic_sdk/intrinsic/math/python:pose3_test
      - name: Materialize and verify reflection-fix LFS assets
        run: |
          git lfs pull
          if git lfs ls-files --long | grep -E '^[0-9a-f]{64} - '; then
            echo 'LFS pointer files remain in the checkout.'
            exit 1
          fi
          test "$(head -c 4 intrinsic_control/intrinsic/models/assets/standard_tooling/robotiq_hande/io_coupler_visual.glb)" = glTF
      - name: Build all targets for reflection fix
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel build //... --spawn_strategy=processwrapper-sandbox
      - name: Build published CI artifacts for reflection fix
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel build //intrinsic_runtime:intrinsic_base //intrinsic/tools/inctl:inctl_external \
            --spawn_strategy=processwrapper-sandbox
      - name: Test all targets for reflection fix
        run: |
          unset -v ANDROID_HOME ANDROID_SDK_HOME ANDROID_SDK_ROOT
          bazel test //... --spawn_strategy=processwrapper-sandbox \
            --strategy=TestRunner=linux-sandbox --test_output=errors
      - name: Report remaining disk space
        if: always()
        run: df -h /
