name: Confirm reflection regression before full validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9171c96a89b4ee3db41fc6fd339cc085c7e1d761
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
      - name: Verify source and targeted regressions
        run: |
          test "$(git rev-parse HEAD)" = 9171c96a89b4ee3db41fc6fd339cc085c7e1d761
          bazel test //intrinsic_sdk/intrinsic/math/python:rotation3_test \
            //intrinsic_sdk/intrinsic/math/python:pose3_test \
            --spawn_strategy=processwrapper-sandbox --test_output=errors
      - name: Confirm original implementation accepts reflections
        run: |
          set -euo pipefail
          source_path=intrinsic_sdk/intrinsic/math/python/rotation3.py
          trap 'git restore -- "$source_path"' EXIT
          git show "979c8ff1f71b0c8a63d546adce8d974b7c39e482:$source_path" > "$source_path"
          set +e
          bazel test //intrinsic_sdk/intrinsic/math/python:rotation3_test \
            //intrinsic_sdk/intrinsic/math/python:pose3_test \
            --spawn_strategy=processwrapper-sandbox --test_output=errors 2>&1 | tee "$RUNNER_TEMP/reflection-regression.log"
          test_status=${PIPESTATUS[0]}
          set -e
          test "$test_status" = 3
          grep -E 'FAIL: test_from_matrix.*rejects_reflection' "$RUNNER_TEMP/reflection-regression.log"
