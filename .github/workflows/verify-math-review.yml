name: Verify math review updates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math_tests:
    name: ${{ matrix.name }} math suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Scalar
            commit: 6d80cb6b107c5c22c909af3d12eaef9245ec7736
            source: math_types.py
            files: math_types.py math_types_test.py
            regression_target: math_types_test
            failure_pattern: 'FAIL: test_get_matching_arrays_preserves_'
          - name: Quaternion
            commit: 81b396bd48eaa1cb1cb96aecc17eeca73a21f589
            source: quaternion.py
            files: quaternion.py quaternion_test.py rotation3_test.py
            regression_target: quaternion_test
            failure_pattern: 'FAIL: test_check_non_zero_.*custom_tolerance'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - name: Verify source and formatting
        env:
          EXPECTED_COMMIT: ${{ matrix.commit }}
          CHANGED_FILES: ${{ matrix.files }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor 979c8ff1f71b0c8a63d546adce8d974b7c39e482 HEAD
          git diff --exit-code 979c8ff1f71b0c8a63d546adce8d974b7c39e482 -- intrinsic_sdk/intrinsic/math/python/BUILD
          git diff --check 979c8ff1f71b0c8a63d546adce8d974b7c39e482 HEAD
          cd intrinsic_sdk/intrinsic/math/python
          pipx run --spec pyink==25.12.0 pyink --check --line-length=80 --pyink-indentation=2 --pyink-use-majority-quotes $CHANGED_FILES
          pipx run --spec isort==6.0.1 isort --check-only --profile=google $CHANGED_FILES
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
      - name: Build and test upstream math suites with added regressions
        run: |
          bazel test \
            //intrinsic_sdk/intrinsic/math/python:math_types_test \
            //intrinsic_sdk/intrinsic/math/python:quaternion_test \
            //intrinsic_sdk/intrinsic/math/python:rotation3_test \
            //intrinsic_sdk/intrinsic/math/python:pose3_test \
            //intrinsic_sdk/intrinsic/math/python:math_test_test \
            --spawn_strategy=processwrapper-sandbox --test_output=errors
      - name: Confirm added regressions detect the original bug
        env:
          SOURCE: ${{ matrix.source }}
          REGRESSION_TARGET: ${{ matrix.regression_target }}
          FAILURE_PATTERN: ${{ matrix.failure_pattern }}
        run: |
          set -euo pipefail
          source_path="intrinsic_sdk/intrinsic/math/python/$SOURCE"
          trap 'git restore -- "$source_path"' EXIT
          git show "979c8ff1f71b0c8a63d546adce8d974b7c39e482:$source_path" > "$source_path"
          set +e
          bazel test "//intrinsic_sdk/intrinsic/math/python:$REGRESSION_TARGET" \
            --spawn_strategy=processwrapper-sandbox --test_output=errors 2>&1 | tee "$RUNNER_TEMP/regression.log"
          test_status=${PIPESTATUS[0]}
          set -e
          test "$test_status" = 3
          grep -E "$FAILURE_PATTERN" "$RUNNER_TEMP/regression.log"
